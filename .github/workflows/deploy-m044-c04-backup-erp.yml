name: Deploy M044-C04 free automatic note translation to backup-erp

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_M044_C04_TO_BACKUP_ERP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backup-erp-deployment
  cancel-in-progress: false

env:
  RUNTIME_COMMIT: 143cf185bb7c1f09d1b45d0acc3e05ca48aecf65
  RELEASE_MISSION: M044-C04-R3
  RELEASE_TAG: m044-c04-staging-r3
  ARTIFACT_NAME: m044-c04-143cf18.tar.gz
  ARTIFACT_SHA: aa8414d07765c6f9074c74e25276e4aa524855b1d3d9e0275a661b29829567a0
  DEPLOY_HOST: 31.97.158.178
  DEPLOY_USER: codex-deploy
  DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-backup-erp-m044-c04-auto-translation
  REMOTE_INBOX: /home/codex-deploy/staging-inbox

jobs:
  deploy:
    name: Validate and deploy M044-C04 on backup-erp
    runs-on: ubuntu-latest
    environment: backup-erp
    timeout-minutes: 20

    steps:
      - name: Require exact staging confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'DEPLOY_M044_C04_TO_BACKUP_ERP'

      - name: Check out the workflow-trigger commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned source and helper contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RUNTIME_COMMIT^{commit}")" = "$RUNTIME_COMMIT"
          test "$(sha256sum deploy/releases/m044-c04-runtime-files.txt | awk '{print $1}')" = '00ce85c831fb14b33f391cebd79779c32b0559af17520cb64430b5ad34f256c9'
          test "$(sha256sum deploy/releases/m044-c04-support-files.txt | awk '{print $1}')" = '105369eb9c2d98e950091e588bb5e6b0d01daef6d6a0905aed7585d22bb300c1'
          test "$(sha256sum custom/chinaplanetshippingprices/admin/batch.php | awk '{print $1}')" = '95377602c5898c698fa6e23729c842c452336a28e632e9f0e234d264eccdaac9'
          test "$(sha256sum custom/chinaplanetshippingprices/admin/import.php | awk '{print $1}')" = 'f0a0148fd560971273f132860ed5bf6a34b27bb235e147eb3eaf3e186b86c00e'
          test "$(sha256sum custom/chinaplanetshippingprices/admin/setup.php | awk '{print $1}')" = '7b90f28d70e12e055ceec6f9c80f1da7852c0c773bf541b9e61ba41f87e12349'
          test "$(sha256sum custom/chinaplanetshippingprices/class/ShippingNoteReviewService.class.php | awk '{print $1}')" = 'bba37e89ef252937ef4d79e69a9cef6e01ed7573fcabe292fcd319f172b92a6d'
          test "$(sha256sum custom/chinaplanetshippingprices/class/ShippingNoteTranslationService.class.php | awk '{print $1}')" = 'a77fc3cae254d875cdf401325bf22d62711b19eb01a638a06cc1a0636575bfb2'
          test "$(sha256sum custom/chinaplanetshippingprices/class/ShippingPriceImporter.class.php | awk '{print $1}')" = '666a81699e8b764a6a32429c4654f2843745a1a0edf66bef3c4bdc6d0e0ac543'
          php -l custom/chinaplanetshippingprices/admin/batch.php >/dev/null
          php -l custom/chinaplanetshippingprices/admin/import.php >/dev/null
          php -l custom/chinaplanetshippingprices/admin/setup.php >/dev/null
          php -l custom/chinaplanetshippingprices/class/ShippingNoteReviewService.class.php >/dev/null
          php -l custom/chinaplanetshippingprices/class/ShippingNoteTranslationService.class.php >/dev/null
          php -l custom/chinaplanetshippingprices/class/ShippingPriceImporter.class.php >/dev/null
          php deploy/tests/test_m041_shipping_note_translation.php
          php deploy/tests/test_m041_shipping_note_translation_source.php
          php deploy/tests/test_m044_c04_free_auto_translation.php
          bash deploy/tests/test_m044_c04_staging_helper.sh

      - name: Download and verify approved artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/m044-c04"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/m044-c04"
          artifact="$RUNNER_TEMP/m044-c04/$ARTIFACT_NAME"
          test -f "$artifact" && test ! -L "$artifact"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA"
          test "$(tar -tzf "$artifact" | wc -l | tr -d ' ')" = '11'
          chmod 0644 "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Configure restricted staging SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload pinned artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" '${{ steps.artifact.outputs.path }}' "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/$ARTIFACT_NAME"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0644 '$REMOTE_INBOX/$ARTIFACT_NAME'"

      - name: Compare staging files
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER compare"

      - name: Restricted staging preflight
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"

      - name: Apply with file backup and automatic rollback
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          output=$(ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER apply")
          printf '%s\n' "$output"
          if grep -Fq 'M044_C04_STAGING_APPLY=PASS' <<<"$output"; then
            echo 'did_mutate=true' >> "$GITHUB_OUTPUT"
          elif grep -Fq 'M044_C04_STAGING_APPLY=NOOP_ALREADY_APPLIED' <<<"$output"; then
            echo 'did_mutate=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Unrecognized staging apply result' >&2
            exit 1
          fi

      - name: Verify deployed staging files
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER verify"

      - name: Roll back if post-apply verification fails
        if: ${{ failure() && steps.apply.outputs.did_mutate == 'true' }}
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER rollback"

      - name: Remove transient SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
