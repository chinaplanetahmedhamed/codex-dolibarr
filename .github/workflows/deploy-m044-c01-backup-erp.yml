name: Deploy M044-C01 import dependency to backup-erp

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_M044_C01_TO_BACKUP_ERP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backup-erp-deployment
  cancel-in-progress: false

env:
  RUNTIME_COMMIT: dc6387f41611f2bec24c5a96eb8aacc252f019ce
  RELEASE_MISSION: M044-C01
  RELEASE_TAG: m044-c01-staging
  ARTIFACT_NAME: m044-c01-dc6387f.tar.gz
  ARTIFACT_SHA: 946479da0e9072ff83e2145ac5a82e75e2109459e262e449ef7375a53446a847
  DEPLOY_HOST: 31.97.158.178
  DEPLOY_USER: codex-deploy
  DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-backup-erp-m044-c01-deploy
  REMOTE_INBOX: /home/codex-deploy/staging-inbox

jobs:
  deploy:
    name: Validate and deploy M044-C01 on backup-erp
    runs-on: ubuntu-latest
    environment: backup-erp
    timeout-minutes: 20

    steps:
      - name: Require exact staging confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'DEPLOY_M044_C01_TO_BACKUP_ERP'

      - name: Check out the workflow-trigger commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned source and helper contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RUNTIME_COMMIT^{commit}")" = "$RUNTIME_COMMIT"
          test "$(sha256sum deploy/releases/m044-c01-runtime-files.txt | awk '{print $1}')" = '51031466dad513a091cfb7e0b03b09ea57b2648159c1b3148548d18f2ce902fd'
          test "$(sha256sum deploy/releases/m044-c01-support-files.txt | awk '{print $1}')" = 'e2a5226abfcde343cea1a2777ee5a2184319850356c071bdc4a6ef5cc57b0822'
          php -l custom/chinaplanetshippingprices/class/ShippingNoteTranslationService.class.php >/dev/null
          php -l deploy/tests/test_m044_c01_import_dependency.php >/dev/null
          php deploy/tests/test_m044_c01_import_dependency.php
          bash deploy/tests/test_m044_c01_staging_helper.sh

      - name: Download and verify approved artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/m044-c01"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/m044-c01"
          artifact="$RUNNER_TEMP/m044-c01/$ARTIFACT_NAME"
          test -f "$artifact" && test ! -L "$artifact"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA"
          test "$(tar -tzf "$artifact" | wc -l | tr -d ' ')" = '10'
          chmod 0644 "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Configure restricted staging SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload pinned artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" '${{ steps.artifact.outputs.path }}' "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/$ARTIFACT_NAME"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0644 '$REMOTE_INBOX/$ARTIFACT_NAME'"

      - name: Compare staging files
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER compare"

      - name: Restricted staging preflight
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"

      - name: Apply with backup and automatic rollback
        id: apply
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER apply"

      - name: Verify deployed staging state
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER verify"

      - name: Roll back if post-apply verification fails
        if: ${{ failure() && steps.apply.outcome == 'success' }}
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER rollback"

      - name: Remove transient SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
