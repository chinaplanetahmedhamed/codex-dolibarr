name: Prepare M046 production with read-only compare and preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PREPARE_M046_PRODUCTION_PREFLIGHT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: erp-production-preflight
  cancel-in-progress: false

env:
  RUNTIME_COMMIT: 15c19dda5842be992e6926db473878042a0a96d5
  RELEASE_MISSION: M046-PRODUCTION-PREFLIGHT
  ARTIFACT_NAME: m046-c01-15c19dd.tar.gz
  ARTIFACT_SHA: 79982ab606c958da9c7193c08464156c4e7e18f07d4ce5b65ba7b5af39164596
  DEPLOY_HOST: 31.97.158.178
  DEPLOY_USER: codex-deploy
  DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-production-m046-translation-policy
  REMOTE_INBOX: /home/codex-deploy/staging-inbox

jobs:
  validate:
    name: Validate production preflight contracts
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Require exact production-preflight confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'PREPARE_M046_PRODUCTION_PREFLIGHT'

      - name: Check out the workflow-trigger commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Build and validate the pinned production artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RUNTIME_COMMIT" HEAD
          mkdir -p "$RUNNER_TEMP/m046-production"
          chmod 0700 "$RUNNER_TEMP/m046-production"
          artifact="$RUNNER_TEMP/m046-production/$ARTIFACT_NAME"
          bash deploy/tools/build_m046_c01_artifact.sh "$artifact"
          test "$(shasum -a 256 "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA"
          M046_C01_TEST_ARTIFACT="$artifact" M046_C01_TEST_TMP_ROOT=/private/tmp bash deploy/tests/test_m046_production_helper.sh
          bash deploy/tests/test_m046_production_release_contract.sh

  preflight:
    name: Upload artifact and inspect erp production read-only
    needs: validate
    runs-on: ubuntu-latest
    environment: erp-production
    timeout-minutes: 25
    steps:
      - name: Require exact production-preflight confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'PREPARE_M046_PRODUCTION_PREFLIGHT'

      - name: Check out the workflow-trigger commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned source and preflight contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RUNTIME_COMMIT" HEAD
          bash -n deploy/tools/chinaplanetos_production_m046_translation_policy.sh
          bash -n deploy/tools/install_production_m046_helper.sh
          bash -n deploy/tools/build_m046_c01_artifact.sh
          bash deploy/tests/test_m046_production_release_contract.sh

      - name: Build and verify deterministic artifact
        id: artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/m046-production"
          artifact="$RUNNER_TEMP/m046-production/$ARTIFACT_NAME"
          bash deploy/tools/build_m046_c01_artifact.sh "$artifact"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA"
          chmod 0644 "$artifact"
          echo "path=$artifact" >>"$GITHUB_OUTPUT"

      - name: Configure restricted production SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify separately installed production helper and restricted sudo surface
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          expected=$(sha256sum deploy/tools/chinaplanetos_production_m046_translation_policy.sh | awk '{print $1}')
          remote_output=$(ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sha256sum '$DEPLOY_HELPER'")
          remote_sha=${remote_output%% *}
          test "$remote_sha" = "$expected"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER status"

      - name: Upload only the pinned production artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" '${{ steps.artifact.outputs.path }}' "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/$ARTIFACT_NAME"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0644 '$REMOTE_INBOX/$ARTIFACT_NAME'"

      - name: Compare production runtime files read-only
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER compare"

      - name: Run restricted production preflight read-only
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"

      - name: Record production helper status
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$HOME/.ssh/id_ed25519" ]]; then
            ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER status"
          fi

      - name: Remove local SSH credentials
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
