name: Deploy M044-C02 schema correction to backup-erp

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_M044_C02_TO_BACKUP_ERP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backup-erp-deployment
  cancel-in-progress: false

env:
  RUNTIME_COMMIT: 46f77f67571e58cf0ee5890ff6cafe5159e5a91c
  RELEASE_MISSION: M044-C02
  RELEASE_TAG: m044-c02-staging
  ARTIFACT_NAME: m044-c02-46f77f6.tar.gz
  ARTIFACT_SHA: 9ed7644b58a91e1ed534617a823a26c19fb1a6d4b756486e7ca0338aa93852a2
  DEPLOY_HOST: 31.97.158.178
  DEPLOY_USER: codex-deploy
  DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-backup-erp-m044-c02-schema
  REMOTE_INBOX: /home/codex-deploy/staging-inbox

jobs:
  deploy:
    name: Validate and deploy M044-C02 on backup-erp
    runs-on: ubuntu-latest
    environment: backup-erp
    timeout-minutes: 25

    steps:
      - name: Require exact staging confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'DEPLOY_M044_C02_TO_BACKUP_ERP'

      - name: Check out the workflow-trigger commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned source and helper contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RUNTIME_COMMIT^{commit}")" = "$RUNTIME_COMMIT"
          test "$(sha256sum deploy/releases/m044-c02-support-files.txt | awk '{print $1}')" = 'aa8171caaad428301306ffdad046c6deb5443cfee10ce39525b3877f6f613e8f'
          test "$(sha256sum deploy/migrations/m041_shipping_note_translation_schema.php | awk '{print $1}')" = 'bc75838ff8d8ba807da59e6e5514e88f1770c050430780fb88c7ae2b5d9606c9'
          php deploy/tests/test_m044_c02_schema_correction.php
          bash deploy/tests/test_m044_c02_staging_helper.sh

      - name: Download and verify approved artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/m044-c02"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/m044-c02"
          artifact="$RUNNER_TEMP/m044-c02/$ARTIFACT_NAME"
          test -f "$artifact" && test ! -L "$artifact"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA"
          test "$(tar -tzf "$artifact" | wc -l | tr -d ' ')" = '7'
          chmod 0644 "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Configure restricted staging SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload pinned artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" '${{ steps.artifact.outputs.path }}' "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/$ARTIFACT_NAME"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0644 '$REMOTE_INBOX/$ARTIFACT_NAME'"

      - name: Compare staging schema
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER compare"

      - name: Restricted staging preflight
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"

      - name: Apply with database backup and automatic rollback
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          output=$(ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER apply")
          printf '%s\n' "$output"
          if grep -Fq 'M044_C02_STAGING_APPLY=PASS' <<<"$output"; then
            echo 'did_mutate=true' >> "$GITHUB_OUTPUT"
          elif grep -Fq 'M044_C02_STAGING_APPLY=NOOP_ALREADY_APPLIED' <<<"$output"; then
            echo 'did_mutate=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Unrecognized staging apply result' >&2
            exit 1
          fi

      - name: Verify deployed staging schema
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER verify"

      - name: Roll back if post-apply verification fails
        if: ${{ failure() && steps.apply.outputs.did_mutate == 'true' }}
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER rollback"

      - name: Remove transient SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
