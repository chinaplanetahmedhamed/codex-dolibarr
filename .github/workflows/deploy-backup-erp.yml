name: Deploy pinned release to backup-erp

on:
  workflow_dispatch:
    inputs:
      release:
        description: Approved staging release
        required: true
        type: choice
        options:
          - m043-c02
          - m045-r01
          - m119-check
          - m119-r01
        default: m043-c02
      confirmation:
        description: Type the exact confirmation for the selected release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backup-erp-deployment
  cancel-in-progress: false

env:
  DELIVERY_COMMIT: be435b377327278ac2231a3b79a4efeec29077b9
  RUNTIME_COMMIT: 87d64018a89e08db4d86551ad046e9d2bebe01fc
  RELEASE_MISSION: M043-C02
  RELEASE_TAG: m043-c02-staging
  ARTIFACT_NAME: m043-87d6401.tar.gz
  ARTIFACT_SHA: 3ab56995901ed5f81c5e301b0a2fcf7ba60948ff78778675a23ab23473b4eb8c
  DEPLOY_HOST: 31.97.158.178
  DEPLOY_USER: codex-deploy
  DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-backup-erp-m043-deploy
  REMOTE_INBOX: /home/codex-deploy/staging-inbox

jobs:
  check_m119:
    if: ${{ inputs.release == 'm119-check' || inputs.release == 'm119-r01' }}
    name: Office Expenses native storage release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.6.27@sha256:4066a44f4a0143c310fbe6972c254bbbb7a844a2be1418831a987fdbbc8ff8bd
        env:
          MARIADB_ROOT_PASSWORD: m119-synthetic-ci-only
        ports:
          - 127.0.0.1:13306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -pm119-synthetic-ci-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      M119_CI_DB_HOST: 127.0.0.1
      M119_CI_DB_PORT: '13306'
      M119_CI_DB_USER: root
      M119_CI_DB_PASSWORD: m119-synthetic-ci-only
    steps:
      - name: Require the staging check request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SELECTED_RELEASE: ${{ inputs.release }}
        run: |
          set -Eeuo pipefail
          if [ "$SELECTED_RELEASE" = m119-r01 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_TO_BACKUP_ERP
          else
            test "$CONFIRMATION" = CHECK_M119_BACKUP_ERP
          fi
      - name: Check out this immutable workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out official version-matched native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Dolibarr/dolibarr
          ref: b7958385f00a92219f76a4dfea67dae93df97a25
          path: native-dolibarr-ci
          persist-credentials: false
      - name: Build digest-pinned exact PHP test container
        run: |
          set -Eeuo pipefail
          docker build --pull=false -f deploy/releases/m119/Dockerfile.ci -t m119-ci:"$GITHUB_SHA" deploy/releases/m119
      - name: Verify immutable release artifact boundaries
        run: |
          python3 deploy/tests/test_m119_release_artifact.py
          python3 deploy/tests/test_m119_runtime_preparation.py
          python3 deploy/tests/test_m119_deploy_helper.py
      - name: Verify syntax and scoped source whitespace
        run: |
          set -Eeuo pipefail
          while IFS= read -r file; do php -l "$file" >/dev/null; done < <(rg --files custom/chinaplanetoperations/office_expenses deploy/tools/office_expenses deploy/tests deploy/releases/m119 | rg '(office_expenses/.+\.php|m119[^/]*\.php|m119_http/.+\.php|m119/.+\.php)$')
          node --check custom/chinaplanetoperations/office_expenses/employee.js
          git diff-tree --check HEAD
      - name: Run complete CLI real MariaDB and private-filesystem checks
        run: |
          set -Eeuo pipefail
          docker run --rm --network host --tmpfs /tmp:rw,noexec,nosuid,nodev \
            -e CI=true -e GITHUB_ACTIONS=true \
            -e M119_CI_DB_HOST -e M119_CI_DB_PORT -e M119_CI_DB_USER -e M119_CI_DB_PASSWORD \
            -v "$GITHUB_WORKSPACE:/work:ro" m119-ci:"$GITHUB_SHA" bash deploy/releases/m119/run_ci.sh
      - name: Record check boundary
        if: ${{ always() }}
        run: |
          printf '%s\n' 'Office Expenses checks only. No VPS connection, credentials read, server migration, deployment or accounting posting.' >> "$GITHUB_STEP_SUMMARY"

  deploy_m119:
    if: ${{ inputs.release == 'm119-r01' }}
    needs: check_m119
    name: Deploy Office Expenses administrator pilot to backup-erp
    runs-on: ubuntu-24.04
    environment: backup-erp
    timeout-minutes: 20
    env:
      M119_SOURCE: 8b14b9e9c609ed296cb18368f576bbf86fffadbb
      M119_ARTIFACT: faa869ec8d05b6e631887bb1dbe0c403deb9d97909cea84ede492ee172bca698
      M119_MANIFEST: 19aa7af9ebc3f6f0dadb6708dec5b182f5dc55a884a42157abc79bb60ef329a7
      M119_HELPER_SHA: 845e497f2828df927ce14e5431d180a747c62bae264fbcee244183696cb967d9
      M119_HELPER: /usr/local/sbin/chinaplanetos-backup-erp-deploy
      M119_TAG: m119-backup-pilot-8b14b9e
    steps:
      - name: Check out the immutable verified delivery revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact release confirmation and source closure
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = DEPLOY_M119_TO_BACKUP_ERP
          test "$(sha256sum deploy/releases/m119/deploy_helper.py | cut -d' ' -f1)" = "$M119_HELPER_SHA"
          python3 - <<'PY'
          import importlib.util, os, subprocess
          spec=importlib.util.spec_from_file_location('m119_builder','deploy/releases/m119/build_artifact.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for path in m.SOURCE_FILES:
              assert subprocess.check_output(['git','show','HEAD:'+path]) == subprocess.check_output(['git','show',os.environ['M119_SOURCE']+':'+path]), 'Runtime changed outside the pinned source.'
          PY
      - name: Download and verify the frozen private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/m119"
          gh release download "$M119_TAG" --repo "$GITHUB_REPOSITORY" --pattern "artifact-$M119_ARTIFACT.tar.gz" --dir "$RUNNER_TEMP/m119"
          gh release download "$M119_TAG" --repo "$GITHUB_REPOSITORY" --pattern "manifest-$M119_ARTIFACT.json" --dir "$RUNNER_TEMP/m119"
          test "$(sha256sum "$RUNNER_TEMP/m119/artifact-$M119_ARTIFACT.tar.gz" | cut -d' ' -f1)" = "$M119_ARTIFACT"
          test "$(sha256sum "$RUNNER_TEMP/m119/manifest-$M119_ARTIFACT.json" | cut -d' ' -f1)" = "$M119_MANIFEST"
          python3 - <<'PY'
          import importlib.util, os, pathlib
          spec=importlib.util.spec_from_file_location('m119_helper','deploy/releases/m119/deploy_helper.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'m119'
          m.validate_package((root/('manifest-'+m.ARTIFACT_SHA+'.json')).read_bytes(),(root/('artifact-'+m.ARTIFACT_SHA+'.tar.gz')).read_bytes())
          PY
      - name: Configure the existing restricted staging SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Verify installed helper and stage the exact code package
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 codex-deploy@31.97.158.178 'test "$(id -u)" = 1002 && test "$(sha256sum /usr/local/sbin/chinaplanetos-backup-erp-deploy | cut -d" " -f1)" = 845e497f2828df927ce14e5431d180a747c62bae264fbcee244183696cb967d9'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$RUNNER_TEMP/m119/artifact-$M119_ARTIFACT.tar.gz" "$RUNNER_TEMP/m119/manifest-$M119_ARTIFACT.json" codex-deploy@31.97.158.178:/home/codex-deploy/staging-inbox/
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 codex-deploy@31.97.158.178 'chmod 0600 /home/codex-deploy/staging-inbox/artifact-faa869ec8d05b6e631887bb1dbe0c403deb9d97909cea84ede492ee172bca698.tar.gz /home/codex-deploy/staging-inbox/manifest-faa869ec8d05b6e631887bb1dbe0c403deb9d97909cea84ede492ee172bca698.json'
      - name: Preflight the fixed backup environment
        run: bash deploy/releases/m119/run_remote_action.sh preflight
      - name: Apply with backup schema verification and entrypoint last
        id: apply
        run: |
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          bash deploy/releases/m119/run_remote_action.sh apply
      - name: Verify installed source native storage permissions and login wall
        run: bash deploy/releases/m119/run_remote_action.sh verify
      - name: Disable only this recorded pilot if apply or verification fails
        if: ${{ failure() && steps.apply.outputs.attempted == 'true' }}
        run: bash deploy/releases/m119/run_remote_action.sh rollback
      - name: Record the server deployment boundary
        if: ${{ always() }}
        run: |
          printf '%s\n' 'Target backup-erp only. Approved administrator1/entity1, Egypt/EGP and China/CNY, native baseUSD. Financial posting disabled. Authenticated browser/save/receipt acceptance is a separate required check.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: ${{ inputs.release == 'm043-c02' }}
    name: Validate and deploy pinned M043-C02 release
    runs-on: ubuntu-latest
    environment: backup-erp
    timeout-minutes: 25

    steps:
      - name: Require exact manual confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'DEPLOY_M043_C02_TO_BACKUP_ERP'

      - name: Check out pinned delivery tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DELIVERY_COMMIT }}
          persist-credentials: false

      - name: Verify pinned scope and source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DELIVERY_COMMIT"
          test "$(sha256sum deploy/releases/m043-runtime-files.txt | awk '{print $1}')" = 'ed7d67ece8e565a9aef0ce4ff8765411737357ade3805d17eadd30f016ca835a'
          test "$(sha256sum deploy/releases/m043-support-files.txt | awk '{print $1}')" = '043f47e31be6e64afbede6afc35b83e3707a7cc1cc60d796545d02ad4e932757'
          while IFS= read -r file; do
            test -f "$file" && test ! -L "$file"
            if [[ "$file" == *.php ]]; then php -l "$file" >/dev/null; fi
          done < <(cat deploy/releases/m043-runtime-files.txt deploy/releases/m043-support-files.txt)
          php deploy/tests/test_m043_gateway_migration.php
          php deploy/tests/test_m043_public_rate_token.php
          php deploy/tests/test_m043_public_website_intake_source.php
          bash deploy/tests/test_m043_staging_helper.sh

      - name: Download and verify the approved release artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/m043"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/m043"
          artifact="$RUNNER_TEMP/m043/$ARTIFACT_NAME"
          test -f "$artifact" && test ! -L "$artifact"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA"
          test "$(python3 -c 'import sys,tarfile; print(len(tarfile.open(sys.argv[1]).getmembers()))' "$artifact")" = '26'
          chmod 0644 "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Configure restricted staging SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare protected gateway secrets
        id: gateway_secrets
        shell: bash
        env:
          API_KEY: ${{ secrets.M043_API_KEY }}
          RATE_TOKEN_KEY: ${{ secrets.M043_RATE_TOKEN_KEY }}
          REQUEST_HMAC_KEY: ${{ secrets.M043_REQUEST_HMAC_KEY }}
        run: |
          set -Eeuo pipefail
          test ${#API_KEY} -ge 32
          test ${#RATE_TOKEN_KEY} -ge 32
          test ${#REQUEST_HMAC_KEY} -ge 32
          install -d -m 0700 "$RUNNER_TEMP/m043-secrets"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/m043-secrets/m043-api.key"
          printf '%s' "$RATE_TOKEN_KEY" > "$RUNNER_TEMP/m043-secrets/m043-rate-token.key"
          printf '%s' "$REQUEST_HMAC_KEY" > "$RUNNER_TEMP/m043-secrets/m043-request-hmac.key"
          chmod 0600 "$RUNNER_TEMP"/m043-secrets/*.key
          echo 'prepared=true' >> "$GITHUB_OUTPUT"

      - name: Upload pinned artifact and transient secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" '${{ steps.artifact.outputs.path }}' "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/$ARTIFACT_NAME"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/m043-secrets/m043-api.key" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/m043-api.key"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/m043-secrets/m043-rate-token.key" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/m043-rate-token.key"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/m043-secrets/m043-request-hmac.key" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/m043-request-hmac.key"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0644 '$REMOTE_INBOX/$ARTIFACT_NAME' && chmod 0600 '$REMOTE_INBOX/m043-api.key' '$REMOTE_INBOX/m043-rate-token.key' '$REMOTE_INBOX/m043-request-hmac.key'"

      - name: Restricted staging preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"

      - name: Apply with server-side backups and automatic rollback
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER apply"

      - name: Verify deployed staging state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER verify"

      - name: Roll back if post-apply verification fails
        if: ${{ failure() && steps.apply.outcome == 'success' }}
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER rollback"

      - name: Remove transient secret files
        if: ${{ always() && steps.gateway_secrets.outputs.prepared == 'true' }}
        shell: bash
        run: |
          if [[ -f "$HOME/.ssh/id_ed25519" ]]; then
            ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "rm -f '$REMOTE_INBOX/m043-api.key' '$REMOTE_INBOX/m043-rate-token.key' '$REMOTE_INBOX/m043-request-hmac.key'" 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/m043-secrets" "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

  deploy_m045:
    if: ${{ inputs.release == 'm045-r01' }}
    name: Validate and deploy M045-R01 on backup-erp
    runs-on: ubuntu-latest
    environment: backup-erp
    timeout-minutes: 25
    env:
      DELIVERY_COMMIT: 9f87197c27f9216d25fac94a7a92bde81877fb2d
      RUNTIME_COMMIT: 8d919fd9f2164bca6cfd859e89df338e985c486a
      RELEASE_MISSION: M045-R01
      RELEASE_TAG: m045-r01-staging
      ARTIFACT_NAME: m045-8d919fd.tar.gz
      ARTIFACT_SHA: 2503f666d86c9422207295e4c21fa000bd725cd7060eb79ec86881652f6846cd
      DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-backup-erp-m045-deploy

    steps:
      - name: Require exact manual confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'DEPLOY_M045_R01_TO_BACKUP_ERP'

      - name: Check out pinned delivery tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.DELIVERY_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned source and helper contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DELIVERY_COMMIT"
          test "$(git rev-parse "$RUNTIME_COMMIT^{commit}")" = "$RUNTIME_COMMIT"
          test "$(sha256sum deploy/releases/m045-runtime-files.txt | awk '{print $1}')" = '21c948877b57b9c3851a374db61df68ea39886174bb05170862c0a958da52608'
          test "$(sha256sum deploy/releases/m045-support-files.txt | awk '{print $1}')" = '81c6dea9e540c4b69500b33702ff06994c02a0a33c4ae70be5407c5eac78a701'
          while IFS= read -r file; do
            test -f "$file" && test ! -L "$file"
            if [[ "$file" == *.php ]]; then php -l "$file" >/dev/null; fi
          done < <(cat deploy/releases/m045-runtime-files.txt deploy/releases/m045-support-files.txt)
          php deploy/tests/test_m045_public_request_quotation_source.php
          bash deploy/tests/test_m045_staging_helper.sh

      - name: Download and verify approved artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/m045"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/m045"
          artifact="$RUNNER_TEMP/m045/$ARTIFACT_NAME"
          test -f "$artifact" && test ! -L "$artifact"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA"
          test "$(tar -tzf "$artifact" | wc -l | tr -d ' ')" = '13'
          chmod 0644 "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Configure restricted staging SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload pinned artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" '${{ steps.artifact.outputs.path }}' "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/$ARTIFACT_NAME"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0644 '$REMOTE_INBOX/$ARTIFACT_NAME'"

      - name: Compare staging files
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER compare"

      - name: Restricted staging preflight
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"

      - name: Apply with backups and automatic rollback
        id: apply
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER apply"

      - name: Verify deployed staging state
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER verify"

      - name: Roll back if post-apply verification fails
        if: ${{ failure() && steps.apply.outcome == 'success' }}
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER rollback"

      - name: Remove transient SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
