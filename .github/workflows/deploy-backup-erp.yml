          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Verify installed helper and upload only the pinned package
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 codex-deploy@31.97.158.178 'test "$(id -u)" = 1002 && test "$(sha256sum /usr/local/sbin/chinaplanetos-backup-erp-deploy | cut -d" " -f1)" = b51706fff210aba0022502aff7b74b698ed6a6f11b5e0286bd9b5f1a3aaa1674'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$RUNNER_TEMP/m119/artifact-$STANDALONE_SHA.tar.gz" "$RUNNER_TEMP/m119/manifest-$STANDALONE_SHA.json" codex-deploy@31.97.158.178:/home/codex-deploy/staging-inbox/
      - name: Preflight exact backup runtime identities and staff baseline
        run: bash deploy/releases/m119/run_sidebar_remote_action.sh preflight
      - name: Back up and replace exactly three reviewed UI files
        id: apply
        run: |
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          bash deploy/releases/m119/run_sidebar_remote_action.sh apply
      - name: Verify updated source and unchanged branch isolation
        run: bash deploy/releases/m119/run_sidebar_remote_action.sh verify
      - name: Restore only the recorded previous UI files on failure
        if: ${{ failure() && steps.apply.outputs.attempted == 'true' }}
        run: bash deploy/releases/m119/run_sidebar_remote_action.sh rollback
      - name: Record exact release boundary
        if: ${{ always() }}
        run: |
          printf '%s\n' 'Backup-erp code-only UI correction: three reviewed files, exact prior deployment inode, private code backups and rollback. No schema, account, grant, password, financial posting, production or service change. Authenticated loader and visual acceptance follow deployment.' >> "$GITHUB_STEP_SUMMARY"

  deploy_m119_workspace:
    if: ${{ inputs.release == 'm119-workspace-r04' }}
    needs: check_m119
    name: Activate all Office Expenses workspace sections on backup-erp
    runs-on: ubuntu-24.04
    environment: backup-erp
    timeout-minutes: 20
    env:
      STANDALONE_SOURCE: 6fa6caf5dde3e3762354ae8faaf4947c49bdb52d
      STANDALONE_SHA: a367cea37de019749ece5a1d8a2016accad6d24d45efc169e06cd98d737f4192
      STANDALONE_MANIFEST: 0e2a55e3a9edc624bf154a754c307a1c12ebfc6af8fd9b4c5cf0d3e18bf8f796
      STANDALONE_HELPER: 709c2221968b17219c87e260b55ca1cd5601e9f7e70031515774ff759fc1d1c6
    steps:
      - name: Check out immutable delivery source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify confirmation helper and source closure then build the frozen package
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = DEPLOY_M119_WORKSPACE_TO_BACKUP_ERP
          test "$(sha256sum deploy/releases/m119/workspace_update_helper.py | cut -d' ' -f1)" = "$STANDALONE_HELPER"
          python3 -B - <<'PYCODE'
          import importlib.util, os, pathlib, subprocess
