name: Deploy pinned release to backup-erp

on:
  workflow_dispatch:
    inputs:
      release:
        description: Approved staging release
        required: true
        type: choice
        options:
          - boards-backup-m107-c02
          - m043-c02
          - m045-r01
          - m089-c02-r2
          - m089-c02-r3
        default: m043-c02
      confirmation:
        description: Type the exact confirmation for the selected release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backup-erp-deployment
  cancel-in-progress: false

env:
  DELIVERY_COMMIT: be435b377327278ac2231a3b79a4efeec29077b9
  RUNTIME_COMMIT: 87d64018a89e08db4d86551ad046e9d2bebe01fc
  RELEASE_MISSION: M043-C02
  RELEASE_TAG: m043-c02-staging
  ARTIFACT_NAME: m043-87d6401.tar.gz
  ARTIFACT_SHA: 3ab56995901ed5f81c5e301b0a2fcf7ba60948ff78778675a23ab23473b4eb8c
  DEPLOY_HOST: 31.97.158.178
  DEPLOY_USER: codex-deploy
  DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-backup-erp-m043-deploy
  REMOTE_INBOX: /home/codex-deploy/staging-inbox

jobs:
  deploy:
    if: ${{ inputs.release == 'm043-c02' }}
    name: Validate and deploy pinned M043-C02 release
    runs-on: ubuntu-latest
    environment: backup-erp
    timeout-minutes: 25

    steps:
      - name: Require exact manual confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'DEPLOY_M043_C02_TO_BACKUP_ERP'

      - name: Check out pinned delivery tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DELIVERY_COMMIT }}
          persist-credentials: false

      - name: Verify pinned scope and source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DELIVERY_COMMIT"
          test "$(sha256sum deploy/releases/m043-runtime-files.txt | awk '{print $1}')" = 'ed7d67ece8e565a9aef0ce4ff8765411737357ade3805d17eadd30f016ca835a'
          test "$(sha256sum deploy/releases/m043-support-files.txt | awk '{print $1}')" = '043f47e31be6e64afbede6afc35b83e3707a7cc1cc60d796545d02ad4e932757'
          while IFS= read -r file; do
            test -f "$file" && test ! -L "$file"
            if [[ "$file" == *.php ]]; then php -l "$file" >/dev/null; fi
          done < <(cat deploy/releases/m043-runtime-files.txt deploy/releases/m043-support-files.txt)
          php deploy/tests/test_m043_gateway_migration.php
          php deploy/tests/test_m043_public_rate_token.php
          php deploy/tests/test_m043_public_website_intake_source.php
          bash deploy/tests/test_m043_staging_helper.sh

      - name: Download and verify the approved release artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/m043"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/m043"
          artifact="$RUNNER_TEMP/m043/$ARTIFACT_NAME"
          test -f "$artifact" && test ! -L "$artifact"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA"
          test "$(python3 -c 'import sys,tarfile; print(len(tarfile.open(sys.argv[1]).getmembers()))' "$artifact")" = '26'
          chmod 0644 "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Configure restricted staging SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare protected gateway secrets
        id: gateway_secrets
        shell: bash
        env:
          API_KEY: ${{ secrets.M043_API_KEY }}
          RATE_TOKEN_KEY: ${{ secrets.M043_RATE_TOKEN_KEY }}
          REQUEST_HMAC_KEY: ${{ secrets.M043_REQUEST_HMAC_KEY }}
        run: |
          set -Eeuo pipefail
          test ${#API_KEY} -ge 32
          test ${#RATE_TOKEN_KEY} -ge 32
          test ${#REQUEST_HMAC_KEY} -ge 32
          install -d -m 0700 "$RUNNER_TEMP/m043-secrets"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/m043-secrets/m043-api.key"
          printf '%s' "$RATE_TOKEN_KEY" > "$RUNNER_TEMP/m043-secrets/m043-rate-token.key"
          printf '%s' "$REQUEST_HMAC_KEY" > "$RUNNER_TEMP/m043-secrets/m043-request-hmac.key"
          chmod 0600 "$RUNNER_TEMP"/m043-secrets/*.key
          echo 'prepared=true' >> "$GITHUB_OUTPUT"

      - name: Upload pinned artifact and transient secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" '${{ steps.artifact.outputs.path }}' "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/$ARTIFACT_NAME"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/m043-secrets/m043-api.key" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/m043-api.key"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/m043-secrets/m043-rate-token.key" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/m043-rate-token.key"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/m043-secrets/m043-request-hmac.key" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/m043-request-hmac.key"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0644 '$REMOTE_INBOX/$ARTIFACT_NAME' && chmod 0600 '$REMOTE_INBOX/m043-api.key' '$REMOTE_INBOX/m043-rate-token.key' '$REMOTE_INBOX/m043-request-hmac.key'"

      - name: Restricted staging preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"

      - name: Apply with server-side backups and automatic rollback
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER apply"

      - name: Verify deployed staging state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER verify"

      - name: Roll back if post-apply verification fails
        if: ${{ failure() && steps.apply.outcome == 'success' }}
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER rollback"

      - name: Remove transient secret files
        if: ${{ always() && steps.gateway_secrets.outputs.prepared == 'true' }}
        shell: bash
        run: |
          if [[ -f "$HOME/.ssh/id_ed25519" ]]; then
            ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "rm -f '$REMOTE_INBOX/m043-api.key' '$REMOTE_INBOX/m043-rate-token.key' '$REMOTE_INBOX/m043-request-hmac.key'" 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/m043-secrets" "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

  deploy_m045:
    if: ${{ inputs.release == 'm045-r01' }}
    name: Validate and deploy M045-R01 on backup-erp
    runs-on: ubuntu-latest
    environment: backup-erp
    timeout-minutes: 25
    env:
      DELIVERY_COMMIT: 9f87197c27f9216d25fac94a7a92bde81877fb2d
      RUNTIME_COMMIT: 8d919fd9f2164bca6cfd859e89df338e985c486a
      RELEASE_MISSION: M045-R01
      RELEASE_TAG: m045-r01-staging
      ARTIFACT_NAME: m045-8d919fd.tar.gz
      ARTIFACT_SHA: 2503f666d86c9422207295e4c21fa000bd725cd7060eb79ec86881652f6846cd
      DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-backup-erp-m045-deploy

    steps:
      - name: Require exact manual confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = 'DEPLOY_M045_R01_TO_BACKUP_ERP'

      - name: Check out pinned delivery tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.DELIVERY_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned source and helper contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DELIVERY_COMMIT"
          test "$(git rev-parse "$RUNTIME_COMMIT^{commit}")" = "$RUNTIME_COMMIT"
          test "$(sha256sum deploy/releases/m045-runtime-files.txt | awk '{print $1}')" = '21c948877b57b9c3851a374db61df68ea39886174bb05170862c0a958da52608'
          test "$(sha256sum deploy/releases/m045-support-files.txt | awk '{print $1}')" = '81c6dea9e540c4b69500b33702ff06994c02a0a33c4ae70be5407c5eac78a701'
          while IFS= read -r file; do
            test -f "$file" && test ! -L "$file"
            if [[ "$file" == *.php ]]; then php -l "$file" >/dev/null; fi
          done < <(cat deploy/releases/m045-runtime-files.txt deploy/releases/m045-support-files.txt)
          php deploy/tests/test_m045_public_request_quotation_source.php
          bash deploy/tests/test_m045_staging_helper.sh

      - name: Download and verify approved artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/m045"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/m045"
          artifact="$RUNNER_TEMP/m045/$ARTIFACT_NAME"
          test -f "$artifact" && test ! -L "$artifact"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$ARTIFACT_SHA"
          test "$(tar -tzf "$artifact" | wc -l | tr -d ' ')" = '13'
          chmod 0644 "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Configure restricted staging SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload pinned artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" '${{ steps.artifact.outputs.path }}' "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_INBOX/$ARTIFACT_NAME"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0644 '$REMOTE_INBOX/$ARTIFACT_NAME'"

      - name: Compare staging files
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER compare"

      - name: Restricted staging preflight
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"

      - name: Apply with backups and automatic rollback
        id: apply
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER apply"

      - name: Verify deployed staging state
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER verify"

      - name: Roll back if post-apply verification fails
        if: ${{ failure() && steps.apply.outcome == 'success' }}
        shell: bash
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER rollback"

      - name: Remove transient SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

  deploy_m089:
    if: ${{ inputs.release == 'm089-c02-r2' }}
    name: Deploy pinned M089 personal worker dashboard to backup-erp
    runs-on: ubuntu-latest
    environment: backup-erp
    timeout-minutes: 15
    env:
      DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-m089-c02-r2-staging
      HELPER_SHA: 7181af1b92b1940b53419ef59fa32b5ec9687b1dc65bda4950eca98478d716c8
      RUNTIME_COMMIT: 5f6dcbe49c52562505275e0913fc5e203e66a396
    steps:
      - name: Require approved release confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'DEPLOY_M089_C02_R2_TO_STAGING'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable payload and recovery tests
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$RUNTIME_COMMIT" HEAD
          test "$(sha256sum deploy/releases/m089-c02-r2/staging.py | awk '{print $1}')" = "$HELPER_SHA"
          python3 deploy/tests/test_m089_release.py
      - name: Configure restricted SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Verify fixed root-owned helper
        shell: bash
        run: |
          set -Eeuo pipefail
          actual=$(ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "stat -c '%U:%G:%a' '$DEPLOY_HELPER' && sha256sum '$DEPLOY_HELPER'")
          test "$(printf '%s\n' "$actual" | head -1)" = 'root:root:755'
          test "$(printf '%s\n' "$actual" | tail -1 | awk '{print $1}')" = "$HELPER_SHA"
      - name: Compare and preflight pinned files
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER compare"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"
      - name: Apply with scoped backup and automatic rollback
        id: apply
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER apply"
      - name: Verify deployed bytes and health
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER verify && sudo -n $DEPLOY_HELPER status"
      - name: Restore prior code on post-apply verification failure
        if: ${{ failure() && steps.apply.outcome == 'success' }}
        run: ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER rollback"
      - name: Remove transient SSH material
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

