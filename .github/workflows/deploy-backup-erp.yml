      - name: Verify fixed root-owned helper
        shell: bash
        run: |
          set -Eeuo pipefail
          actual=$(ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "stat -c '%U:%G:%a' '$DEPLOY_HELPER' && sha256sum '$DEPLOY_HELPER'")
          test "$(printf '%s\n' "$actual" | head -1)" = 'root:root:755'
          test "$(printf '%s\n' "$actual" | tail -1 | awk '{print $1}')" = "$HELPER_SHA"
      - name: Compare and preflight pinned files
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER compare"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n $DEPLOY_HELPER preflight"
