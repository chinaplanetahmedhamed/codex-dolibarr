name: Deploy pinned release to backup-erp

on:
  workflow_dispatch:
    inputs:
      release:
        description: Approved staging release
        required: true
        type: choice
        options:
          - m043-c02
          - m045-r01
          - m119-check
          - m119-r01
          - m119-standalone-r01
          - m119-ui-r02
          - m119-sidebar-r03
          - m119-workspace-r04
          - m119-receipt-r05
          - m119-receipt-r06
          - m119-design-r07
          - m119-design-r08
          - m119-sidebar-verify
        default: m043-c02
      confirmation:
        description: Type the exact confirmation for the selected release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backup-erp-deployment
  cancel-in-progress: false

env:
  DELIVERY_COMMIT: be435b377327278ac2231a3b79a4efeec29077b9
  RUNTIME_COMMIT: 87d64018a89e08db4d86551ad046e9d2bebe01fc
  RELEASE_MISSION: M043-C02
  RELEASE_TAG: m043-c02-staging
  ARTIFACT_NAME: m043-87d6401.tar.gz
  ARTIFACT_SHA: 3ab56995901ed5f81c5e301b0a2fcf7ba60948ff78778675a23ab23473b4eb8c
  DEPLOY_HOST: 31.97.158.178
  DEPLOY_USER: codex-deploy
  DEPLOY_HELPER: /usr/local/sbin/chinaplanetos-backup-erp-m043-deploy
  REMOTE_INBOX: /home/codex-deploy/staging-inbox

jobs:
  check_m119:
    if: ${{ inputs.release == 'm119-check' || inputs.release == 'm119-r01' || inputs.release == 'm119-standalone-r01' || inputs.release == 'm119-ui-r02' || inputs.release == 'm119-sidebar-r03' || inputs.release == 'm119-sidebar-verify' || inputs.release == 'm119-workspace-r04' || inputs.release == 'm119-receipt-r05' || inputs.release == 'm119-receipt-r06' || inputs.release == 'm119-design-r07' || inputs.release == 'm119-design-r08' }}
    name: Office Expenses native storage release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.6.27@sha256:4066a44f4a0143c310fbe6972c254bbbb7a844a2be1418831a987fdbbc8ff8bd
        env:
          MARIADB_ROOT_PASSWORD: m119-synthetic-ci-only
        ports:
          - 127.0.0.1:13306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -pm119-synthetic-ci-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      M119_CI_DB_HOST: 127.0.0.1
      M119_CI_DB_PORT: '13306'
      M119_CI_DB_USER: root
      M119_CI_DB_PASSWORD: m119-synthetic-ci-only
    steps:
      - name: Require the staging check request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SELECTED_RELEASE: ${{ inputs.release }}
        run: |
          set -Eeuo pipefail
          if [ "$SELECTED_RELEASE" = m119-r01 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_TO_BACKUP_ERP
          elif [ "$SELECTED_RELEASE" = m119-standalone-r01 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_STANDALONE_TO_BACKUP_ERP
          elif [ "$SELECTED_RELEASE" = m119-ui-r02 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_UI_TO_BACKUP_ERP
          elif [ "$SELECTED_RELEASE" = m119-sidebar-r03 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_SIDEBAR_TO_BACKUP_ERP
          elif [ "$SELECTED_RELEASE" = m119-workspace-r04 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_WORKSPACE_TO_BACKUP_ERP
          elif [ "$SELECTED_RELEASE" = m119-receipt-r05 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_RECEIPT_TO_BACKUP_ERP
          elif [ "$SELECTED_RELEASE" = m119-receipt-r06 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_RECEIPT_R06_TO_BACKUP_ERP
          elif [ "$SELECTED_RELEASE" = m119-design-r07 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_DESIGN_R07_TO_BACKUP_ERP
          elif [ "$SELECTED_RELEASE" = m119-design-r08 ]; then
            test "$CONFIRMATION" = DEPLOY_M119_DESIGN_R08_TO_BACKUP_ERP
          elif [ "$SELECTED_RELEASE" = m119-sidebar-verify ]; then
            test "$CONFIRMATION" = VERIFY_M119_SIDEBAR_ON_BACKUP_ERP
          else
            test "$CONFIRMATION" = CHECK_M119_BACKUP_ERP
          fi
      - name: Check out this immutable workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out official version-matched native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Dolibarr/dolibarr
          ref: b7958385f00a92219f76a4dfea67dae93df97a25
          path: native-dolibarr-ci
          persist-credentials: false
      - name: Build digest-pinned exact PHP test container
        run: |
          set -Eeuo pipefail
          docker build --pull=false -f deploy/releases/m119/Dockerfile.ci -t m119-ci:"$GITHUB_SHA" deploy/releases/m119
      - name: Verify immutable release artifact boundaries
        run: |
          python3 deploy/tests/test_m119_release_artifact.py
          python3 deploy/tests/test_m119_standalone_artifact.py
          python3 -B deploy/tests/test_m119_standalone_deployer.py
          python3 -B deploy/tests/test_m119_ui_updater.py
          python3 -B deploy/tests/test_m119_sidebar_updater.py
          python3 -B deploy/tests/test_m119_workspace_deployer.py
          python3 -B deploy/tests/test_m119_receipt_deployer.py
          python3 -B deploy/tests/test_m119_receipt_acceptance_deployer.py
          python3 -B deploy/tests/test_m119_design_deployer.py
          python3 -B deploy/tests/test_m119_design_acceptance_deployer.py
          python3 -B deploy/tests/test_m119_workspace_deployer.py --prepare-fixtures "$RUNNER_TEMP/m119-workspace-fixtures"
          python3 -B deploy/tests/test_m119_receipt_deployer.py --prepare-fixtures "$RUNNER_TEMP/m119-workspace-fixtures"
          python3 -B deploy/tests/test_m119_receipt_acceptance_deployer.py --prepare-fixtures "$RUNNER_TEMP/m119-workspace-fixtures"
          python3 -B deploy/tests/test_m119_design_deployer.py --prepare-fixtures "$RUNNER_TEMP/m119-workspace-fixtures"
          python3 -B deploy/tests/test_m119_design_acceptance_deployer.py --prepare-fixtures "$RUNNER_TEMP/m119-workspace-fixtures"
          python3 deploy/tests/test_m119_runtime_preparation.py
          python3 deploy/tests/test_m119_deploy_helper.py
      - name: Verify syntax and scoped source whitespace
        run: |
          set -Eeuo pipefail
          while IFS= read -r file; do php -l "$file" >/dev/null; done < <(rg --files custom/chinaplanetofficeexpenses custom/chinaplanetoperations/office_expenses deploy/tools/office_expenses deploy/tests deploy/releases/m119 | rg '(chinaplanetofficeexpenses/.+\.php|office_expenses/.+\.php|m119[^/]*\.php|m119_http/.+\.php|m119/.+\.php)$')
          node --check custom/chinaplanetofficeexpenses/employee.js
          node --check custom/chinaplanetofficeexpenses/workspace.js
          git diff-tree --check HEAD
      - name: Run complete CLI real MariaDB and private-filesystem checks
        run: |
          set -Eeuo pipefail
          docker run --rm --network host --tmpfs /tmp:rw,noexec,nosuid,nodev \
            -e CI=true -e GITHUB_ACTIONS=true -e M119_WORKSPACE_FIXTURES=/m119-workspace-fixtures \
            -e M119_CI_DB_HOST -e M119_CI_DB_PORT -e M119_CI_DB_USER -e M119_CI_DB_PASSWORD \
            -v "$RUNNER_TEMP/m119-workspace-fixtures:/m119-workspace-fixtures:ro" \
            -v "$GITHUB_WORKSPACE:/work:ro" m119-ci:"$GITHUB_SHA" bash deploy/releases/m119/run_ci.sh
      - name: Build the complete standalone code package
        run: |
          set -Eeuo pipefail
          python3 -B deploy/releases/m119/build_standalone_artifact.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/m119-standalone"
      - name: Retain the verified standalone package and checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m119-standalone-${{ github.sha }}
          path: ${{ runner.temp }}/m119-standalone/
          if-no-files-found: error
          retention-days: 14
      - name: Record check boundary
        if: ${{ always() }}
        run: |
          printf '%s\n' 'Office Expenses checks only. No VPS connection, credentials read, server migration, deployment or accounting posting.' >> "$GITHUB_STEP_SUMMARY"

  deploy_m119_standalone:
    if: ${{ inputs.release == 'm119-standalone-r01' }}
    needs: check_m119
    name: Deploy standalone Office Expenses and approved branch roles to backup-erp
    runs-on: ubuntu-24.04
    environment: backup-erp
    timeout-minutes: 20
    env:
      STANDALONE_SOURCE: 1b88b8869e700ad54a441124e980105ca6313cfa
      STANDALONE_SHA: 3f3254ae3f1fb4bd186b8d37afb7f3b7e31826291a18dad24599dcabf417fd1e
      STANDALONE_MANIFEST: b8a62ae39a372018f5fed3bccdab701de65be6e80ebf4420797368d032d6f7c1
      STANDALONE_HELPER: 471df8d4985121ed6b512f2ed4361c459dd080c30e4b71ffaf40aaf3fb6ce7de
    steps:
      - name: Check out immutable delivery source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify confirmation helper and source closure then build the frozen package
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = DEPLOY_M119_STANDALONE_TO_BACKUP_ERP
          test "$(sha256sum deploy/releases/m119/standalone_deploy_helper.py | cut -d' ' -f1)" = "$STANDALONE_HELPER"
          python3 -B - <<'PYCODE'
          import importlib.util, os, pathlib, subprocess
          spec=importlib.util.spec_from_file_location('standalone','deploy/releases/m119/build_standalone_artifact.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for path in m.RUNTIME_FILES:
              assert subprocess.check_output(['git','show','HEAD:'+path]) == subprocess.check_output(['git','show',os.environ['STANDALONE_SOURCE']+':'+path]), 'Pinned application source changed.'
          m.build(os.environ['STANDALONE_SOURCE'],pathlib.Path(os.environ['RUNNER_TEMP'])/'m119')
          PYCODE
          test "$(sha256sum "$RUNNER_TEMP/m119/artifact-$STANDALONE_SHA.tar.gz" | cut -d' ' -f1)" = "$STANDALONE_SHA"
          test "$(sha256sum "$RUNNER_TEMP/m119/manifest-$STANDALONE_SHA.json" | cut -d' ' -f1)" = "$STANDALONE_MANIFEST"
      - name: Use the existing restricted staging identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Verify installed helper and upload only the pinned package
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 codex-deploy@31.97.158.178 'test "$(id -u)" = 1002 && test "$(sha256sum /usr/local/sbin/chinaplanetos-backup-erp-deploy | cut -d" " -f1)" = 471df8d4985121ed6b512f2ed4361c459dd080c30e4b71ffaf40aaf3fb6ce7de'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$RUNNER_TEMP/m119/artifact-$STANDALONE_SHA.tar.gz" "$RUNNER_TEMP/m119/manifest-$STANDALONE_SHA.json" codex-deploy@31.97.158.178:/home/codex-deploy/staging-inbox/
      - name: Preflight exact backup runtime identities and staff baseline
        run: bash deploy/releases/m119/run_standalone_remote_action.sh preflight
      - name: Back up install activate and accept branch isolation
        id: apply
        run: |
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          bash deploy/releases/m119/run_standalone_remote_action.sh apply
      - name: Independently verify persisted roles receipts source and login wall
        run: bash deploy/releases/m119/run_standalone_remote_action.sh verify
      - name: Disable the recorded new release on failure and retain all data
        if: ${{ failure() && steps.apply.outputs.attempted == 'true' }}
        run: bash deploy/releases/m119/run_standalone_remote_action.sh rollback
      - name: Record exact release boundary
        if: ${{ always() }}
        run: |
          printf '%s\n' 'Backup-erp only; approved four native users/groups, additive membership schema, branch/own read-create operational drafts. Four marked synthetic 1-unit drafts and one private image retained for acceptance. No password change, financial posting, production or container lifecycle. Actual staff credential/login acceptance remains separate.' >> "$GITHUB_STEP_SUMMARY"

  deploy_m119_ui:
    if: ${{ inputs.release == 'm119-ui-r02' }}
    needs: check_m119
    name: Fix Office Expenses loading and restore full navigation on backup-erp
    runs-on: ubuntu-24.04
    environment: backup-erp
    timeout-minutes: 20
    env:
      STANDALONE_SOURCE: e59efa9a33e5c21b5bbd82e37caf6c1670713480
      STANDALONE_SHA: c1ae3bb30a849834165e4810beedadc69cb3112d486c897da874abf177a96ec3
      STANDALONE_MANIFEST: 6d6640ef6aa79ff9dfed05d13776f0666b6162d053034465c03990548f3036de
      STANDALONE_HELPER: 388b8d24178307b790f178aec8c4fadc62a9ce68f993adbfc840f8f7da8a4757
    steps:
      - name: Check out immutable delivery source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify confirmation helper and source closure then build the frozen package
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = DEPLOY_M119_UI_TO_BACKUP_ERP
          test "$(sha256sum deploy/releases/m119/ui_update_helper.py | cut -d' ' -f1)" = "$STANDALONE_HELPER"
          python3 -B - <<'PYCODE'
          import importlib.util, os, pathlib, subprocess
          spec=importlib.util.spec_from_file_location('standalone','deploy/releases/m119/build_standalone_artifact.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for path in m.RUNTIME_FILES:
              assert subprocess.check_output(['git','show','HEAD:'+path]) == subprocess.check_output(['git','show',os.environ['STANDALONE_SOURCE']+':'+path]), 'Pinned application source changed.'
          m.build(os.environ['STANDALONE_SOURCE'],pathlib.Path(os.environ['RUNNER_TEMP'])/'m119')
          PYCODE
          test "$(sha256sum "$RUNNER_TEMP/m119/artifact-$STANDALONE_SHA.tar.gz" | cut -d' ' -f1)" = "$STANDALONE_SHA"
          test "$(sha256sum "$RUNNER_TEMP/m119/manifest-$STANDALONE_SHA.json" | cut -d' ' -f1)" = "$STANDALONE_MANIFEST"
      - name: Use the existing restricted staging identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Verify installed helper and upload only the pinned package
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 codex-deploy@31.97.158.178 'test "$(id -u)" = 1002 && test "$(sha256sum /usr/local/sbin/chinaplanetos-backup-erp-deploy | cut -d" " -f1)" = 388b8d24178307b790f178aec8c4fadc62a9ce68f993adbfc840f8f7da8a4757'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$RUNNER_TEMP/m119/artifact-$STANDALONE_SHA.tar.gz" "$RUNNER_TEMP/m119/manifest-$STANDALONE_SHA.json" codex-deploy@31.97.158.178:/home/codex-deploy/staging-inbox/
      - name: Preflight exact backup runtime identities and staff baseline
        run: bash deploy/releases/m119/run_ui_remote_action.sh preflight
      - name: Back up and replace exactly five reviewed UI files
        id: apply
        run: |
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          bash deploy/releases/m119/run_ui_remote_action.sh apply
      - name: Verify updated source and unchanged branch isolation
        run: bash deploy/releases/m119/run_ui_remote_action.sh verify
      - name: Restore only the recorded previous UI files on failure
        if: ${{ failure() && steps.apply.outputs.attempted == 'true' }}
        run: bash deploy/releases/m119/run_ui_remote_action.sh rollback
      - name: Record exact release boundary
        if: ${{ always() }}
        run: |
          printf '%s\n' 'Backup-erp code-only UI correction: five reviewed files, exact prior deployment inode, private code backups and rollback. No schema, account, grant, password, financial posting, production or service change. Authenticated loader and visual acceptance follow deployment.' >> "$GITHUB_STEP_SUMMARY"

  deploy_m119_sidebar:
    if: ${{ inputs.release == 'm119-sidebar-r03' }}
    needs: check_m119
    name: Use only the Office Expenses sidebar on backup-erp
    runs-on: ubuntu-24.04
    environment: backup-erp
    timeout-minutes: 20
    env:
      STANDALONE_SOURCE: 26ce07fdef53765121532837dbaf7dcc2f6057cf
      STANDALONE_SHA: 87c828b1ef26187384e705fa184ef5bc9567106c0f19d5c8a17b702efabc1830
      STANDALONE_MANIFEST: 0518d3464781345ee10a8fab960ed5b54ccb5bc1de6468c72d690da83dbbc69b
      STANDALONE_HELPER: b51706fff210aba0022502aff7b74b698ed6a6f11b5e0286bd9b5f1a3aaa1674
    steps:
      - name: Check out immutable delivery source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify confirmation helper and source closure then build the frozen package
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$CONFIRMATION" = DEPLOY_M119_SIDEBAR_TO_BACKUP_ERP
          test "$(sha256sum deploy/releases/m119/sidebar_update_helper.py | cut -d' ' -f1)" = "$STANDALONE_HELPER"
          python3 -B - <<'PYCODE'
          import importlib.util, os, pathlib, subprocess
          spec=importlib.util.spec_from_file_location('standalone','deploy/releases/m119/build_standalone_artifact.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for path in m.RUNTIME_FILES:
              assert subprocess.check_output(['git','show','HEAD:'+path]) == subprocess.check_output(['git','show',os.environ['STANDALONE_SOURCE']+':'+path]), 'Pinned application source changed.'
          m.build(os.environ['STANDALONE_SOURCE'],pathlib.Path(os.environ['RUNNER_TEMP'])/'m119')
          PYCODE
          test "$(sha256sum "$RUNNER_TEMP/m119/artifact-$STANDALONE_SHA.tar.gz" | cut -d' ' -f1)" = "$STANDALONE_SHA"
          test "$(sha256sum "$RUNNER_TEMP/m119/manifest-$STANDALONE_SHA.json" | cut -d' ' -f1)" = "$STANDALONE_MANIFEST"
      - name: Use the existing restricted staging identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
