        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$RUNTIME_COMMIT" HEAD
          test "$(sha256sum deploy/releases/m089-c02-r3/staging.py | awk '{print $1}')" = "$HELPER_SHA"
          M089_RELEASE_VARIANT=m089-c02-r3 python3 deploy/tests/test_m089_release.py
          php deploy/tests/test_m089_kanban_access.php
      - name: Configure restricted SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
