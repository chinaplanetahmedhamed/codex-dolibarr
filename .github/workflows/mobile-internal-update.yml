name: Publish mobile internal OTA update

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_CHINAPLANET_INTERNAL_OTA
        required: true
        type: string
      binary_source_commit:
        description: Full Git SHA used to build the installed M021 internal APK
        required: true
        type: string
      message:
        description: Short internal update description without customer data
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-internal-ota
  cancel-in-progress: false

jobs:
  update:
    name: Publish from mobile-develop to the internal channel
    if: ${{ github.ref == 'refs/heads/mobile-develop' }}
    runs-on: ubuntu-latest
    environment: mobile-internal-ota
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/chinaplanet-customer-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      CHINAPLANET_APP_VARIANT: internal
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_API_BASE_URL: https://erp.visiontrading.biz/api/index.php/chinaplanetcustomercenter/mobile/v1
      EXPO_PUBLIC_PRODUCTION_APPROVED: 'true'
      CONFIRMATION: ${{ inputs.confirmation }}
      BINARY_SOURCE_COMMIT: ${{ inputs.binary_source_commit }}
      UPDATE_MESSAGE: ${{ inputs.message }}

    steps:
      - name: Check out exact mobile-develop source
        uses: actions/checkout@v4
        with:
          ref: mobile-develop
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact internal publication authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/mobile-develop'
          test "$CONFIRMATION" = 'PUBLISH_CHINAPLANET_INTERNAL_OTA'
          test -n "$EXPO_TOKEN"
          test "$EAS_PROJECT_ID" = 'a69d974c-5792-466c-80b2-bdded33cf0fb'
          test "$EXPO_OWNER" = 'vision-trading'
          test -n "$UPDATE_MESSAGE"
          test "$(printf '%s' "$BINARY_SOURCE_COMMIT" | wc -c | tr -d ' ')" = '40'
          git cat-file -e "$BINARY_SOURCE_COMMIT^{commit}"
          test -z "$(git status --porcelain)"

      - name: Block native changes after the installed binary
        shell: bash
        run: |
          set -Eeuo pipefail
          native_changes="$(git diff --name-only "$BINARY_SOURCE_COMMIT"..HEAD -- \
            mobile/chinaplanet-customer-app/package.json \
            mobile/chinaplanet-customer-app/package-lock.json \
            mobile/chinaplanet-customer-app/app.config.ts \
            mobile/chinaplanet-customer-app/eas.json \
            mobile/chinaplanet-customer-app/android \
            mobile/chinaplanet-customer-app/ios)"
          test -z "$native_changes"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/chinaplanet-customer-app/package-lock.json

      - name: Set up pinned EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.0.2
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify source and internal runtime configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npx expo install --check
          npx -y expo-doctor
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm test
          public_config="$(npx expo config --type public --json)"
          node -e 'const c=JSON.parse(process.argv[1]); if(c.owner!=="vision-trading"||c.extra?.eas?.projectId!=="a69d974c-5792-466c-80b2-bdded33cf0fb"||c.android?.package!=="com.chinaplanet.customer.internal"||c.version!=="1.0.2"||c.runtimeVersion?.policy!=="appVersion"||c.updates?.enabled===false||c.updates?.url!=="https://u.expo.dev/a69d974c-5792-466c-80b2-bdded33cf0fb") process.exit(1)' "$public_config"
          test -z "$(git status --porcelain)"

      - name: Publish signed compatible update to internal only
        run: eas update --channel internal --message "$UPDATE_MESSAGE" --non-interactive
