name: Build mobile internal test release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_CHINAPLANET_MOBILE_INTERNAL
        required: true
        type: string
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options: [android, ios, all]

permissions:
  contents: read

concurrency:
  group: mobile-internal-build
  cancel-in-progress: false

jobs:
  build:
    name: Build from mobile-develop for internal testers
    if: ${{ github.ref == 'refs/heads/mobile-develop' }}
    runs-on: ubuntu-latest
    environment: mobile-internal
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/chinaplanet-customer-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}

    steps:
      - name: Require exact branch and confirmation
        shell: bash
        working-directory: .
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/mobile-develop'
          test "$CONFIRMATION" = 'BUILD_CHINAPLANET_MOBILE_INTERNAL'
          test -n "$EXPO_TOKEN"
          test "$EAS_PROJECT_ID" = 'a69d974c-5792-466c-80b2-bdded33cf0fb'
          test "$EXPO_OWNER" = 'vision-trading'

      - name: Check out mobile-develop
        uses: actions/checkout@v4
        with:
          ref: mobile-develop
          persist-credentials: false

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/chinaplanet-customer-app/package-lock.json

      - name: Set up pinned EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.0.2
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install and verify source
        run: |
          set -Eeuo pipefail
          npm ci
          npx expo install --check
          npx -y expo-doctor
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm test
          public_config="$(CHINAPLANET_APP_VARIANT=internal npx expo config --type public --json)"
          node -e 'const c=JSON.parse(process.argv[1]); if(c.owner!=="vision-trading"||c.extra?.eas?.projectId!=="a69d974c-5792-466c-80b2-bdded33cf0fb"||c.android?.package!=="com.chinaplanet.customer.internal"||c.version!=="1.0.2"||c.runtimeVersion?.policy!=="appVersion"||c.updates?.enabled===false||c.updates?.url!=="https://u.expo.dev/a69d974c-5792-466c-80b2-bdded33cf0fb") process.exit(1)' "$public_config"

      - name: Dispatch internal EAS build
        env:
          PLATFORM: ${{ inputs.platform }}
        run: eas build --platform "$PLATFORM" --profile internal --non-interactive --no-wait
